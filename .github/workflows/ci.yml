name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Build, static analysis, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Detekt (static analysis)
        run: ./gradlew detekt

      - name: Core domain unit tests (JVM)
        run: ./gradlew :core:domain:jvmTest

      - name: Android lint
        run: ./gradlew :android:app:lintDebug

      - name: Assemble debug app
        run: ./gradlew :android:app:assembleDebug

  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
