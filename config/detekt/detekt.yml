# Detekt overlay on top of the default config (buildUponDefaultConfig).
# Security-relevant rules stay strict; noisy defaults that conflict with
# Compose UI code are relaxed deliberately.
build:
  maxIssues: 0

complexity:
  LongMethod:
    active: false
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false

exceptions:
  # Deliberate fallback catches (e.g. StrongBox unavailable -> regular Keystore)
  # are documented at the catch site and re-dispatched, not silently ignored.
  SwallowedException:
    active: false

naming:
  FunctionNaming:
    # Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']

style:
  DataClassContainsFunctions:
    # Data classes carry init-block validation of the data-minimization contract.
    active: false
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  MaxLineLength:
    maxLineLength: 140
